server {
    listen 80;
    server_name localhost;

    # Serve static files from the root directory
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Forward all requests that don't match a file to index.html (React Router fix)
        try_files $uri $uri/ /index.html;
    }

    # Optional: Cache static assets for better performance
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
    # Proxy API requests to the backend container
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /booking-requests/ {
        proxy_pass http://backend:8000/booking-requests/;
        proxy_set_header Host $host;
    }

    location /notifications/ {
        proxy_pass http://backend:8000/notifications/;
        proxy_set_header Host $host;
    }

    location /static/uploads/ {
        proxy_pass http://backend:8000/static/uploads/;
        proxy_set_header Host $host;
    }
}
